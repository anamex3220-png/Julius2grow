databases:
  - name: julius-vacaciones-db
    plan: free
    databaseName: julius_vacaciones
    user: julius

services:
  - type: web
    name: julius-vacaciones
    runtime: node
    plan: free
    buildCommand: >-
      npm install --prefix server &&
      npx prisma generate --schema=server/prisma/schema.prisma &&
      npm run build --prefix server &&
      npm install --prefix client &&
      npm run build --prefix client
    preDeployCommand: npx prisma migrate deploy --schema=server/prisma/schema.prisma
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: julius-vacaciones-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
