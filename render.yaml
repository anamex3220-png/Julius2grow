databases:
  - name: julius-vacaciones-db
    plan: free
    databaseName: julius_vacaciones
    user: julius

services:
  - type: web
    name: julius-vacaciones
    runtime: node
    plan: free
    buildCommand: >-
      cd server &&
      npm install &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run build &&
      cd ../client &&
      npm install &&
      npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: julius-vacaciones-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
